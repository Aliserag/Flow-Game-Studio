name: deploy-itch

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    name: Itch.io HTML5 deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.6.stable
          key: godot-export-4.6-stable-${{ runner.os }}

      - name: Install Godot 4.6 (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/share/godot/export_templates/4.6.stable
          curl -sL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          curl -sL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q -o /tmp/templates.tpz -d /tmp/templates_extract
          cp /tmp/templates_extract/templates/*.zip /tmp/templates_extract/templates/*.apk \
             /tmp/templates_extract/templates/icudt_godot.dat \
             /tmp/templates_extract/templates/version.txt \
             ~/.local/share/godot/export_templates/4.6.stable/ 2>/dev/null || true

      - name: Import project
        run: ~/.local/bin/godot --headless --path . --editor --quit || true

      - name: Export Web
        run: |
          mkdir -p build
          ~/.local/bin/godot --headless --path . \
            --export-release "Web" build/index.html

      - name: Install butler
        run: |
          curl -sL -o /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          ~/butler/butler -V

      - name: Push to Itch
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "Missing ITCH_API_KEY or ITCH_GAME secret — skipping deploy"
            exit 0
          fi
          ~/butler/butler push build/ "$ITCH_GAME:web" \
            --userversion "${{ github.ref_name }}"
