name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gut-tests:
    name: GUT test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.6-stable-${{ runner.os }}

      - name: Install Godot 4.6 (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

      - name: Verify Godot
        run: ~/.local/bin/godot --version

      - name: Import project (build class cache)
        run: ~/.local/bin/godot --headless --path . --editor --quit || true

      - name: Run GUT suite
        run: |
          ~/.local/bin/godot --headless --path . \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests -ginclude_subdirs -gexit
